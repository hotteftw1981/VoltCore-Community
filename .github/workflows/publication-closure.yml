name: Community Publication Closure
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publication-closure.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATA_DIR: /tmp/voltcore-publication-review-data
      VOLTCORE_UPDATE_CHECK_ENABLED: '0'
      ENABLE_API_DOCS: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Retain reachable source history for private review
        run: |
          mkdir -p /tmp/voltcore-publication-review "$DATA_DIR"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*' '+refs/pull/*/head:refs/remotes/pull/*' --prune
          git bundle create /tmp/voltcore-publication-review/reachable-history.bundle --all
          git for-each-ref --format='%(objectname) %(refname)' > /tmp/voltcore-publication-review/refs.txt
          git rev-list --all --count
      - name: Install exact release dependencies
        run: pip install -r requirements.txt -r tests/requirements.txt
      - name: Resolve baseline failures without suppressing them
        run: |
          python - <<'PY' > /tmp/voltcore-publication-review/tests.txt 2>&1
          import json, unittest, importlib.metadata
          from pathlib import Path
          suite = unittest.defaultTestLoader.discover('tests', pattern='test_*.py')
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          issues = [{'test': case.id(), 'traceback': detail} for case, detail in result.expectedFailures + result.failures + result.errors]
          Path('/tmp/voltcore-publication-review/test-findings.json').write_text(json.dumps(issues, indent=2))
          packages = []
          for dist in importlib.metadata.distributions():
              meta = dist.metadata
              packages.append({'name': meta['Name'], 'version': dist.version, 'license_expression': meta.get('License-Expression'), 'license': meta.get('License'), 'classifiers': [v for v in meta.get_all('Classifier', []) if 'License' in v], 'project_urls': meta.get_all('Project-URL', [])})
          Path('/tmp/voltcore-publication-review/dependency-licenses.json').write_text(json.dumps(packages, indent=2))
          PY
      - name: Scan historic and current source without logging secret values
        shell: bash
        run: |
          set -euo pipefail
          v=8.28.0
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          expected=$(awk -v file="gitleaks_${v}_linux_x64.tar.gz" '$2 == file {print $1}' /tmp/gitleaks-checksums.txt)
          test -n "$expected"
          echo "$expected  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git --log-opts='--all' --exit-code 0 --report-format json --report-path /tmp/voltcore-publication-review/history-findings.json . >/tmp/voltcore-publication-review/scanner-history.log 2>&1
          /tmp/gitleaks dir --exit-code 0 --report-format json --report-path /tmp/voltcore-publication-review/current-findings.json app >/tmp/voltcore-publication-review/scanner-current.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/voltcore-publication-review')
          print('BASELINE_FINDINGS', len(json.loads((root/'test-findings.json').read_text())))
          for name in ('current', 'history'):
              findings = json.loads((root/(name+'-findings.json')).read_text())
              print(name.upper()+'_SCANNER_CANDIDATES', len(findings))
          PY
      - name: Private closure review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publication-closure-review
          path: /tmp/voltcore-publication-review/
          retention-days: 1
