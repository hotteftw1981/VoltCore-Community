name: Community 3E Core Recovery
on:
  push:
    branches: ['fix/community-3e-core-recovery']
permissions:
  contents: write
concurrency:
  group: community-3e-core-recovery
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VOLTCORE_QA_ALLOW_EMPTY_SETUP: '1'
    steps:
      - name: Checkout immutable revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Restore only reviewed shared helpers and audit expression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          python scripts/restore_community_core.py | tee qa-evidence/restored-functions.txt
          python -m compileall -q app tests scripts
          git diff --check
          diff -u <(printf 'app/db.py\napp/main.py\n') <(git diff --name-only)
          git diff -- app/db.py app/main.py > qa-evidence/recovery.patch
      - name: Build test image
        run: docker build -t community-core-recovery .
      - name: Full regression suite
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --entrypoint python -e DATA_DIR=/tmp/unit-data \
            -e VOLTCORE_UPDATE_CHECK_ENABLED=0 -v "$PWD:/work:ro" -w /work \
            community-core-recovery -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee qa-evidence/unit-tests.txt
      - name: Start isolated test instance
        run: |
          docker run -d --name community-core-recovery -p 127.0.0.1:18010:8000 \
            -e VOLTCORE_UPDATE_CHECK_ENABLED=0 -e COOKIE_SECURE=0 community-core-recovery
      - name: Real first-run and API test
        shell: bash
        run: |
          set -o pipefail
          python scripts/smoke_community_http.py --phase initial 2>&1 | tee qa-evidence/http-initial.txt
      - name: Restart and verify persisted state
        shell: bash
        run: |
          set -o pipefail
          docker restart community-core-recovery
          python scripts/smoke_community_http.py --phase restart 2>&1 | tee qa-evidence/http-restart.txt
      - name: Verify no hidden runtime exceptions
        run: |
          docker logs community-core-recovery > qa-evidence/container.log 2>&1
          if grep -Eq 'Traceback \(most recent call last\)|Application startup failed|Task exception was never retrieved' qa-evidence/container.log; then
            tail -100 qa-evidence/container.log
            exit 1
          fi
      - name: Commit validated runtime changes to isolated recovery branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/fix/community-3e-core-recovery
          diff -u <(printf 'app/db.py\napp/main.py\n') <(git diff --name-only)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/db.py app/main.py
          git commit -m 'fix: restore shared Community runtime and first-run audit logging'
          git push origin HEAD:refs/heads/fix/community-3e-core-recovery
          git rev-parse HEAD > qa-evidence/verified-commit.txt
      - name: Collect failure logs
        if: failure()
        run: |
          docker logs community-core-recovery > qa-evidence/container.log 2>&1 || true
          tail -100 qa-evidence/container.log || true
      - name: Retain recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-core-recovery-${{ github.run_id }}
          path: qa-evidence/
          retention-days: 7
      - name: Clean up isolated instance
        if: always()
        run: |
          docker rm -f community-core-recovery >/dev/null 2>&1 || true
          rm -f /tmp/community-http-qa-state.json
