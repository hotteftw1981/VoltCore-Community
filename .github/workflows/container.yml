name: Community Container

on:
  workflow_run:
    workflows: ["Community CI"]
    types: [completed]
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: community-container-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "branch=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}

      - name: Read Community version
        id: version
        shell: bash
        run: |
          VERSION="$(python - <<'PY'
          import re
          from pathlib import Path
          text=Path("app/main.py").read_text(encoding="utf-8")
          match=re.search(r'^APP_VERSION\s*=\s*["\x27]([^"\x27]+)["\x27]',text,re.M)
          if not match:
              raise SystemExit("APP_VERSION not found")
          print(match.group(1))
          PY
          )"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          IMAGE="ghcr.io/hotteftw1981/voltcore-community"
          BRANCH="${{ steps.source.outputs.branch }}"
          SHORT_SHA="$(printf '%s' '${{ steps.source.outputs.sha }}' | cut -c1-7)"
          if [ "$BRANCH" = "main" ]; then
            {
              echo "value<<EOF"
              echo "$IMAGE:latest"
              echo "$IMAGE:${{ steps.version.outputs.version }}"
              echo "$IMAGE:v${{ steps.version.outputs.version }}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "value<<EOF"
              echo "$IMAGE:dev"
              echo "$IMAGE:dev-$SHORT_SHA"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Community image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.value }}
          labels: |
            org.opencontainers.image.title=VoltCore Community
            org.opencontainers.image.description=Free self-hosted OCPP 1.6J charging management
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish summary
        shell: bash
        run: |
          {
            echo "## VoltCore Community container"
            echo ""
            echo "Branch: \`${{ steps.source.outputs.branch }}\`"
            echo "Commit: \`${{ steps.source.outputs.sha }}\`"
            echo "Version: \`${{ steps.version.outputs.version }}\`"
            echo ""
            echo "Published tags:"
            while IFS= read -r tag; do
              [ -n "$tag" ] && echo "- \`$tag\`"
            done <<< "${{ steps.tags.outputs.value }}"
          } >> "$GITHUB_STEP_SUMMARY"
