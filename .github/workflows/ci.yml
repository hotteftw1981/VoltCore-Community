name: Community CI

on:
  push:
    branches: [main, develop, 'cleanup/community-*', 'feature/community-*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VOLTCORE_QA_ALLOW_EMPTY_SETUP: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q app tests scripts updater

      - name: Community tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate Docker Compose definitions
        run: |
          docker compose -f docker-compose.yml config >/tmp/community-compose.yml
          docker compose -f docker-compose.portainer.yml config >/tmp/community-portainer-compose.yml

      - name: Build Community updater
        run: docker build --pull -t voltcore-community-updater-ci:${{ github.sha }} updater

      - name: Exercise Docker one-click updater
        shell: bash
        run: |
          set -euo pipefail
          token_dir="$RUNNER_TEMP/community-updater-token"
          qa_dir="$RUNNER_TEMP/community-updater-qa"
          fake_dir="$RUNNER_TEMP/community-updater-fake"
          mkdir -p "$token_dir" "$qa_dir" "$fake_dir"
          cat >"$fake_dir/docker" <<'SH'
          #!/bin/sh
          printf '%s\n' "$*" >> /qa/docker.log
          exit 0
          SH
          chmod +x "$fake_dir/docker"
          trap 'docker rm -f voltcore-community-updater-test >/dev/null 2>&1 || true' EXIT

          docker run -d --name voltcore-community-updater-test \
            -p 127.0.0.1:19011:9011 \
            -e PATH=/fake:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -v "$token_dir:/run/voltcore-updater" \
            -v "$qa_dir:/qa" \
            -v "$fake_dir/docker:/fake/docker:ro" \
            voltcore-community-updater-ci:${{ github.sha }}

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:19011/health >/tmp/updater-health.json \
              && test -s "$token_dir/token"; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:19011/health | grep -q '"status": "ok"'

          unauthorized="$(curl --silent --output /tmp/updater-unauthorized.json --write-out '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -d '{"target_version":"9.9.9"}' http://127.0.0.1:19011/update)"
          test "$unauthorized" = "401"

          token="$(cat "$token_dir/token")"
          accepted="$(curl --silent --output /tmp/updater-accepted.json --write-out '%{http_code}' \
            -X POST -H "Authorization: Bearer $token" -H 'Content-Type: application/json' \
            -d '{"target_version":"9.9.9"}' http://127.0.0.1:19011/update)"
          test "$accepted" = "202"

          for attempt in $(seq 1 30); do
            if test -f "$qa_dir/docker.log" \
              && grep -q 'compose -p voltcore-community -f /workspace/docker-compose.yml up -d --no-deps --force-recreate voltcore-community' "$qa_dir/docker.log"; then
              break
            fi
            sleep 1
          done
          cat "$qa_dir/docker.log"
          grep -qx 'pull ghcr.io/hotteftw1981/voltcore-community:v9.9.9' "$qa_dir/docker.log"
          grep -qx 'tag ghcr.io/hotteftw1981/voltcore-community:v9.9.9 ghcr.io/hotteftw1981/voltcore-community:latest' "$qa_dir/docker.log"
          grep -qx 'compose -p voltcore-community -f /workspace/docker-compose.yml up -d --no-deps --force-recreate voltcore-community' "$qa_dir/docker.log"

      - name: Build Community container
        run: docker build --pull -t voltcore-community-ci:${{ github.sha }} .

      - name: Prepare isolated runtime state
        run: python scripts/prepare_community_qa.py

      - name: Start disposable Community container
        run: |
          docker run -d --name voltcore-community-ci \
            -p 127.0.0.1:18010:8000 -p 127.0.0.1:19010:9000 \
            -v "$RUNNER_TEMP/community-runtime-data:/data" \
            -e COOKIE_SECURE=0 \
            voltcore-community-ci:${{ github.sha }}

      - name: Full first-run, role and negative HTTP smoke
        run: python scripts/smoke_community_http.py --phase initial

      - name: Restart container and verify persistence
        run: |
          docker restart voltcore-community-ci
          python scripts/smoke_community_http.py --phase restart

      - name: Build Community release archive
        run: python scripts/build_release.py --dist dist

      - name: Verify Community release archive
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          archives = list(Path("dist").glob("VoltCore_Community_V*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected one Community ZIP, found {len(archives)}")
          required = {
              ".env.example",
              "CHANGELOG.md",
              "Dockerfile",
              "README.md",
              "README.en.md",
              "docker-compose.yml",
              "docker-compose.portainer.yml",
              "requirements.txt",
          }
          with zipfile.ZipFile(archives[0]) as zf:
              names = zf.namelist()
              top = names[0].split("/", 1)[0]
              missing = sorted(x for x in required if f"{top}/{x}" not in names)
              if missing:
                  raise SystemExit("Release archive missing: " + ", ".join(missing))
              if not any(x.startswith(f"{top}/app/") for x in names):
                  raise SystemExit("Release archive missing app/")
              if not any(x.startswith(f"{top}/docs/") for x in names):
                  raise SystemExit("Release archive missing docs/")
              if not any(x.startswith(f"{top}/updater/") for x in names):
                  raise SystemExit("Release archive missing updater/")
              if any("/tests/" in x or "/dev/" in x or "/.github/" in x for x in names):
                  raise SystemExit("Release archive contains development-only files")
          print("Community release archive OK:", archives[0])
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs voltcore-community-ci || true

      - name: Cleanup disposable runtime
        if: always()
        run: |
          docker rm -f voltcore-community-ci >/dev/null 2>&1 || true
          rm -f /tmp/community-http-qa-state.json
          rm -rf "$RUNNER_TEMP/community-runtime-data"
