name: Community CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.env.example'
  pull_request:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'docker-compose*.yml'
      - '.env.example'
  workflow_dispatch:

concurrency:
  group: voltcore-community-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile
        run: python -m compileall -q app

      - name: Community tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Build Community container
        run: docker build --pull -t voltcore-community-ci:${{ github.sha }} .

      - name: Start Community container
        run: |
          docker run -d             --name voltcore-community-ci             -p 18010:8000             -p 19010:9000             -v voltcore-community-ci-data:/data             voltcore-community-ci:${{ github.sha }}

      - name: Wait for health endpoint
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:18010/health > /tmp/voltcore-health.json; then
              cat /tmp/voltcore-health.json
              python - <<'PY'
          import json
          from pathlib import Path
          payload=json.loads(Path("/tmp/voltcore-health.json").read_text())
          assert payload.get("status")=="ok", payload
          assert payload.get("version"), payload
          print("VoltCore Community container is healthy:", payload)
          PY
              exit 0
            fi
            if ! docker ps --format '{{.Names}}' | grep -qx voltcore-community-ci; then
              echo "Container stopped before becoming healthy."
              docker logs voltcore-community-ci || true
              exit 1
            fi
            sleep 2
          done
          echo "Timed out waiting for /health."
          docker logs voltcore-community-ci || true
          exit 1

      - name: Verify fresh first-run state
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --silent --output /tmp/root.html --write-out '%{http_code}' http://127.0.0.1:18010/)"
          test "$code" = "303" || test "$code" = "307"
          location="$(curl --silent --head http://127.0.0.1:18010/ | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')"
          test "$location" = "/setup"
          echo "Fresh installation correctly redirects to /setup."

      - name: Verify complete first-run wizard
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/voltcore-cookies.txt /tmp/setup.headers /tmp/first-run.headers

          setup_code="$(curl --silent --output /tmp/setup.body --dump-header /tmp/setup.headers --cookie-jar /tmp/voltcore-cookies.txt --write-out '%{http_code}'             --data-urlencode 'username=community-admin'             --data-urlencode 'display_name=Community Admin'             --data-urlencode 'password=CommunityTest!2026'             --data-urlencode 'password_repeat=CommunityTest!2026'             http://127.0.0.1:18010/setup)"
          test "$setup_code" = "303"
          setup_location="$(tr -d '\r' < /tmp/setup.headers | awk 'tolower($1)=="location:" {print $2}')"
          test "$setup_location" = "/first-run"

          wizard_code="$(curl --silent --output /tmp/first-run.html --cookie /tmp/voltcore-cookies.txt --write-out '%{http_code}' http://127.0.0.1:18010/first-run)"
          test "$wizard_code" = "200"
          grep -q "VoltCore Community einrichten" /tmp/first-run.html

          finish_code="$(curl --silent --output /tmp/finish.body --dump-header /tmp/first-run.headers --cookie /tmp/voltcore-cookies.txt --cookie-jar /tmp/voltcore-cookies.txt --write-out '%{http_code}'             --data-urlencode 'organization_name=Community Test'             --data-urlencode 'display_name=VoltCore Community Test'             --data-urlencode 'tariff_name=Standardtarif'             --data-urlencode 'default_monthly_kwh=0'             http://127.0.0.1:18010/first-run)"
          test "$finish_code" = "303"
          finish_location="$(tr -d '\r' < /tmp/first-run.headers | awk 'tolower($1)=="location:" {print $2}')"
          test "$finish_location" = "/"

          dashboard_code="$(curl --silent --output /tmp/dashboard.html --cookie /tmp/voltcore-cookies.txt --write-out '%{http_code}' http://127.0.0.1:18010/)"
          test "$dashboard_code" = "200"
          grep -q "VoltCore Community Test" /tmp/dashboard.html
          echo "Complete Community first-run flow passed."

      - name: Container logs on failure
        if: failure()
        run: docker logs voltcore-community-ci || true

      - name: Cleanup container
        if: always()
        run: |
          docker rm -f voltcore-community-ci >/dev/null 2>&1 || true
          docker volume rm voltcore-community-ci-data >/dev/null 2>&1 || true
