name: Community QA

on:
  push:
    branches:
      - refactor/community-full-runtime-base
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATA_DIR: /tmp/voltcore-community-data
      ENABLE_API_DOCS: "0"
      VOLTCORE_UPDATE_CHECK_ENABLED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Import application with fresh data directory
        run: |
          mkdir -p "$DATA_DIR"
          python -c "import app.main; print('VoltCore Community import OK:', app.main.APP_VERSION)"

      - name: Run tests
        run: pytest -q
