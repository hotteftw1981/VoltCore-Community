name: voltcore-community

services:
  voltcore-community-updater:
    build:
      context: ./updater
    container_name: voltcore-community-updater
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    expose:
      - "9011"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
      - voltcore_community_updater:/run/voltcore-updater
    environment:
      UPDATE_AGENT_PORT: 9011
      UPDATE_AGENT_WORKSPACE: /workspace
      UPDATE_AGENT_COMPOSE_FILE: /workspace/docker-compose.yml
      UPDATE_AGENT_COMPOSE_PROJECT: voltcore-community
      UPDATE_AGENT_COMPOSE_SERVICE: voltcore-community
      UPDATE_AGENT_IMAGE_REPOSITORY: ghcr.io/hotteftw1981/voltcore-community
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9011/health', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  voltcore-community:
    image: ${VOLTCORE_COMMUNITY_IMAGE:-ghcr.io/hotteftw1981/voltcore-community:latest}
    container_name: voltcore-community
    restart: unless-stopped
    init: true
    read_only: true
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    depends_on:
      voltcore-community-updater:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-8010}:8000"
      - "${OCPP_HOST_PORT:-9000}:9000"
    volumes:
      - voltcore_community_data:/data
      - ${OCPP_TLS_CERT_DIR:-voltcore_community_tls}:/run/ocpp-tls:ro
      - voltcore_community_updater:/run/voltcore-updater:ro
    environment:
      DATA_DIR: /data
      WEB_PORT: 8000
      OCPP_PORT: 9000
      STANDTIME_GRACE_SECONDS: 120
      POWER_FLOW_THRESHOLD_KW: 0.05
      WEB_MAX_FAILURES: 8
      WEB_FAILURE_WINDOW_MINUTES: 10
      OCPP_AUTH_MAX_FAILURES: 8
      OCPP_AUTH_FAILURE_WINDOW_MINUTES: 10
      LIVE_TELEMETRY_MAX_AGE_SECONDS: 300
      LIVE_SOC_MAX_AGE_SECONDS: 300
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      PBKDF2_ITERATIONS: ${PBKDF2_ITERATIONS:-600000}
      OCPP_TLS_CERTFILE: ${OCPP_TLS_CERTFILE:-}
      OCPP_TLS_KEYFILE: ${OCPP_TLS_KEYFILE:-}
      UPDATE_GITHUB_REPOSITORY: ${UPDATE_GITHUB_REPOSITORY:-hotteftw1981/VoltCore-Community}
      UPDATE_CHANNEL: ${UPDATE_CHANNEL:-stable}
      UPDATE_IMAGE_REPOSITORY: ${UPDATE_IMAGE_REPOSITORY:-ghcr.io/hotteftw1981/voltcore-community}
      UPDATE_AGENT_URL: http://voltcore-community-updater:9011
      UPDATE_AGENT_TOKEN_FILE: /run/voltcore-updater/token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  voltcore_community_data:
  voltcore_community_tls:
  voltcore_community_updater:
